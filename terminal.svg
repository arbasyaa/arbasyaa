<text y="1083.7" font-family="monospace" font-size="14.5"><tspan x="24" fill="#f9e2af" font-weight="700">🎫 TixGo Backend — High-Concurrency Ticketing System</tspan></text>
<text y="1104.7" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cdd6f4" font-weight="400">Production-ready backend for flash-sale scenarios with atomic stock management and</tspan></text>
<text y="1125.7" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cdd6f4" font-weight="400">async order processing.</tspan></text>
<text y="1149.8" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cba6f7" font-weight="700">[Tech Stack]</tspan></text>
<text y="1170.8" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cdd6f4" font-weight="400">Go • Gin • PostgreSQL • Redis • RabbitMQ • Docker</tspan></text>
<text y="1195.0" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cba6f7" font-weight="700">[Features]</tspan></text>
<text y="1216.0" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Redis atomic DECRBY (zero overselling guarantee)</tspan></text>
<text y="1237.0" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• RabbitMQ async order processing</tspan></text>
<text y="1258.0" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Idempotent payment webhooks with HMAC-SHA256</tspan></text>
<text y="1279.0" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Automatic stock recovery on order expiry</tspan></text>
<text y="1300.0" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Admin dashboard with real-time metrics</tspan></text>
<text y="1321.0" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Circuit breaker for external calls</tspan></text>
<text y="1345.2" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cba6f7" font-weight="700">[QA Results]</tspan></text>
<text y="1366.2" font-family="monospace" font-size="13.5"><tspan x="40" fill="#a6e3a1" font-weight="700">32/32 </tspan><tspan fill="#cdd6f4" font-weight="400">tests passed (100%)</tspan></text>
<text y="1387.2" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cba6f7" font-weight="700">[Load Test]</tspan></text>
<text y="1408.2" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">1000 concurrent orders in ~8.1s</tspan></text>
