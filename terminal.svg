<text font-family="monospace" font-size="14.5"><tspan x="24" dy="0" fill="#f9e2af" font-weight="700">📈 Emiten — Advanced Financial Decision-Making Platform</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cdd6f4" font-weight="400">Real-time stock &amp; crypto analysis for Indonesian market (IDX) with technical indicators,</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cdd6f4" font-weight="400">fundamentals, screener, and portfolio tracking.</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cba6f7" font-weight="700">[Tech Stack]</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cdd6f4" font-weight="400">Next.js • TypeScript • Hono • TradingView Charts • Zustand</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cba6f7" font-weight="700">[Features]</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• 6+ Technical indicators (RSI, MACD, Bollinger Bands, EMA, SMA)</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Fundamental analysis with 0-100 valuation scoring</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• LQ45 stock screener with pre-built strategies</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Portfolio tracker with real-time P&amp;L calculation</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Price alerts with browser notifications</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Bilingual interface (EN/ID)</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cba6f7" font-weight="700">[Architecture]</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cdd6f4" font-weight="400">Next.js frontend + Hono backend + Redis cache</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#94e2d5" font-weight="400">🔗 </tspan><tspan x="24" dy="21" fill="#94e2d5" font-weight="400">https://github.com/arbasyaa/emiten-app</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#a6e3a1" font-weight="700">$</tspan><tspan x="24" dy="21" fill="#cdd6f4" font-weight="400"> </tspan><tspan x="24" dy="21" fill="#cdd6f4" font-weight="400">cat projects/tixgo-backend/README.md</tspan></text>
<text font-family="monospace" font-size="14.5"><tspan x="24" dy="0" fill="#f9e2af" font-weight="700">🎫 TixGo Backend — High-Concurrency Ticketing System</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cdd6f4" font-weight="400">Production-ready backend for flash-sale scenarios with atomic stock management and</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cdd6f4" font-weight="400">async order processing.</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cba6f7" font-weight="700">[Tech Stack]</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cdd6f4" font-weight="400">Go • Gin • PostgreSQL • Redis • RabbitMQ • Docker</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cba6f7" font-weight="700">[Features]</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Redis atomic DECRBY (zero overselling guarantee)</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• RabbitMQ async order processing</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Idempotent payment webhooks with HMAC-SHA256</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Automatic stock recovery on order expiry</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Admin dashboard with real-time metrics</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">• Circuit breaker for external calls</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cba6f7" font-weight="700">[QA Results]</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#a6e3a1" font-weight="700">32/32 </tspan><tspan x="40" dy="21" fill="#cdd6f4" font-weight="400">tests passed (100%)</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="24" dy="0" fill="#cba6f7" font-weight="700">[Load Test]</tspan></text>
<text font-family="monospace" font-size="13.5"><tspan x="40" dy="0" fill="#cdd6f4" font-weight="400">1000 concurrent orders in ~8.1s</tspan></text>
