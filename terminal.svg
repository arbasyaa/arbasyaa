<text x="36" y="1084" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• 6+ Technical indicators (RSI, MACD, Bollinger Bands, EMA, SMA)</text>
<text x="36" y="1104" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Fundamental analysis with 0-100 valuation scoring</text>
<text x="36" y="1124" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• LQ45 stock screener with pre-built strategies</text>
<text x="36" y="1144" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Portfolio tracker with real-time P&amp;L calculation</text>
<text x="36" y="1164" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Price alerts with browser notifications</text>
<text x="36" y="1184" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Bilingual interface (EN/ID)</text>
<text x="36" y="1208" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Architecture: Next.js frontend + Hono backend + Redis cache</text>
