<text y="718.3" font-family="monospace" font-size="14.5"><tspan x="24" fill="#f9e2af" font-weight="700">📈 Emiten — Advanced Financial Decision-Making Platform</tspan></text>
<text y="739.3" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cdd6f4" font-weight="400">Real-time stock &amp; crypto analysis for Indonesian market (IDX) with technical indicators,</tspan></text>
<text y="760.3" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cdd6f4" font-weight="400">fundamentals, screener, and portfolio tracking.</tspan></text>
<text y="784.4" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cba6f7" font-weight="700">[Tech Stack]</tspan></text>
<text y="805.4" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cdd6f4" font-weight="400">Next.js • TypeScript • Hono • TradingView Charts • Zustand</tspan></text>
<text y="829.6" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cba6f7" font-weight="700">[Features]</tspan></text>
<text y="850.6" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• 6+ Technical indicators (RSI, MACD, Bollinger Bands, EMA, SMA)</tspan></text>
<text y="871.6" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Fundamental analysis with 0-100 valuation scoring</tspan></text>
<text y="892.6" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• LQ45 stock screener with pre-built strategies</tspan></text>
<text y="913.6" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Portfolio tracker with real-time P&amp;L calculation</tspan></text>
<text y="934.6" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Price alerts with browser notifications</tspan></text>
<text y="955.6" font-family="monospace" font-size="13.5"><tspan x="40" fill="#cdd6f4" font-weight="400">• Bilingual interface (EN/ID)</tspan></text>
<text y="979.7" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cba6f7" font-weight="700">[Architecture]</tspan></text>
<text y="1000.7" font-family="monospace" font-size="13.5"><tspan x="24" fill="#cdd6f4" font-weight="400">Next.js frontend + Hono backend + Redis cache</tspan></text>
<text y="1024.9" font-family="monospace" font-size="13.5"><tspan x="24" fill="#94e2d5" font-weight="400">🔗 </tspan><tspan fill="#94e2d5" font-weight="400">https://github.com/arbasyaa/emiten-app</tspan></text>
