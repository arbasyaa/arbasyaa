<text x="20" y="706" font-family="monospace" font-size="14" font-weight="700" fill="#f9e2af">📈 Emiten — Advanced Financial Decision-Making Platform</text>
<text x="20" y="726" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Real-time stock &amp; crypto analysis for Indonesian market (IDX) with</text>
<text x="20" y="746" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">technical indicators, fundamentals, screener, and portfolio tracking.</text>
<text x="36" y="772" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Tech Stack: Next.js • TypeScript • Hono • TradingView Charts • Zustand</text>
<text x="36" y="796" font-family="monospace" font-size="13" font-weight="700" fill="#cba6f7">Features:</text>
<text x="36" y="816" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• 6+ Technical indicators (RSI, MACD, Bollinger Bands, EMA, SMA)</text>
<text x="36" y="836" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Fundamental analysis with 0-100 valuation scoring</text>
<text x="36" y="856" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• LQ45 stock screener with pre-built strategies</text>
<text x="36" y="876" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Portfolio tracker with real-time P&amp;L calculation</text>
<text x="36" y="896" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Price alerts with browser notifications</text>
<text x="36" y="916" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Bilingual interface (EN/ID)</text>
<text x="36" y="940" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Architecture: Next.js frontend + Hono backend + Redis cache</text>
<text x="36" y="964" font-family="monospace" font-size="13" font-weight="400" fill="#94e2d5">🔗 https://github.com/arbasyaa/emiten-app</text>
