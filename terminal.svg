<text x="20" y="1020" font-family="monospace" font-size="14" font-weight="700" fill="#f9e2af">🎫 TixGo Backend — High-Concurrency Ticketing System</text>
<text x="20" y="1040" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Production-ready backend for flash-sale scenarios with atomic stock</text>
<text x="20" y="1060" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">management and async order processing.</text>
<text x="36" y="1086" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Tech Stack: Go • Gin • PostgreSQL • Redis • RabbitMQ • Docker</text>
<text x="36" y="1110" font-family="monospace" font-size="13" font-weight="700" fill="#cba6f7">Features:</text>
<text x="36" y="1130" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Redis atomic DECRBY (zero overselling guarantee)</text>
<text x="36" y="1150" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• RabbitMQ async order processing</text>
<text x="36" y="1170" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Idempotent payment webhooks with HMAC-SHA256</text>
<text x="36" y="1190" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Automatic stock recovery on order expiry</text>
<text x="36" y="1210" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Admin dashboard with real-time metrics</text>
<text x="36" y="1230" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Circuit breaker for external calls</text>
<text x="36" y="1254" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">QA Results: 32/32 tests passed (100%)</text>
<text x="36" y="1274" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Load Test: 1000 concurrent orders in ~8.1s</text>
