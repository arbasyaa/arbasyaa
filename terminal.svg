<text x="20" y="1288" font-family="monospace" font-size="14" font-weight="700" fill="#f9e2af">🎫 TixGo Backend — High-Concurrency Ticketing System</text>
<text x="20" y="1308" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Production-ready backend for flash-sale scenarios with atomic stock</text>
<text x="20" y="1328" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">management and async order processing.</text>
<text x="36" y="1354" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Tech Stack: Go • Gin • PostgreSQL • Redis • RabbitMQ • Docker</text>
<text x="36" y="1378" font-family="monospace" font-size="13" font-weight="700" fill="#cba6f7">Features:</text>
<text x="36" y="1398" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Redis atomic DECRBY (zero overselling guarantee)</text>
<text x="36" y="1418" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• RabbitMQ async order processing</text>
<text x="36" y="1438" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Idempotent payment webhooks with HMAC-SHA256</text>
<text x="36" y="1458" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Automatic stock recovery on order expiry</text>
<text x="36" y="1478" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Admin dashboard with real-time metrics</text>
<text x="36" y="1498" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">• Circuit breaker for external calls</text>
<text x="36" y="1522" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">QA Results: 32/32 tests passed (100%)</text>
<text x="36" y="1542" font-family="monospace" font-size="13" font-weight="400" fill="#cdd6f4">Load Test: 1000 concurrent orders in ~8.1s</text>
